<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tornados Scoreboard</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
body{
    font-family: Arial, sans-serif;
    background:#0c1a2b;
    color:white;
    text-align:center;
}

h1{
    color:#00c3ff;
    text-shadow:0 0 12px #00c3ff;
}

input{
    padding:6px;
    margin:4px;
}

button{
    padding:6px 10px;
    margin:3px;
    cursor:pointer;
}

#players{
    margin-top:20px;
}

.player{
    padding:6px;
    border-bottom:1px solid #2e3c50;
}

.exportArea{
    background:#0f2238;
    padding:20px;
    width:900px;
    margin:auto;
    color:white;
}

.headerLine{
    font-size:18px;
    margin-bottom:6px;
}

.divider{
    height:1px;
    background:#00c3ff55;
    margin:10px 0;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:6px;
}

.alt{
    background:#142b47;
}

.logoSmall{
    width:60px;
}

.glow{
    text-shadow:0 0 15px #00c3ff;
}
</style>
</head>
<body>

<h1 class="glow">TORNADOS SCOREBOARD</h1>

<div>
Category: <input id="category" value="U14">
Jornada: <input id="jornada" value="3">
</div>

<div>
Home Score: <input id="homeScore" type="number" value="0">
Away Score: <input id="awayScore" type="number" value="0">
</div>

<hr>

<h3>Add Player</h3>
<input id="playerName" placeholder="Player Name">
<button onclick="addPlayer()">Add Player</button>

<div id="players"></div>

<br>
<button onclick="exportFinalScore()">Export Final Score</button>
<button onclick="exportPlayerStats()">Export Player Stats</button>

<script>
let players = [];

function addPlayer(){
    const name = document.getElementById("playerName").value.trim();
    if(!name) return;

    players.push({
        name,
        stats:{
            TD:0,
            FLAG:0,
            CATCH:0
        }
    });

    document.getElementById("playerName").value="";
    renderPlayers();
}

function renderPlayers(){
    const container=document.getElementById("players");
    container.innerHTML="";

    players.forEach((player,index)=>{
        const div=document.createElement("div");
        div.className="player";

        div.innerHTML=`
        <strong>${player.name}</strong>
        ${statButton(index,"TD")}
        ${statButton(index,"FLAG")}
        ${statButton(index,"CATCH")}
        `;

        container.appendChild(div);
    });
}

function statButton(index,stat){
    return `
    <button 
    onmousedown="startPress(${index},'${stat}')"
    onmouseup="endPress()"
    ontouchstart="startPress(${index},'${stat}')"
    ontouchend="endPress()"
    onclick="addStat(${index},'${stat}')">
    +${stat}
    </button>
    `;
}

let pressTimer;
function startPress(index,stat){
    pressTimer = window.setTimeout(()=>{
        subtractStat(index,stat);
    },600);
}

function endPress(){
    clearTimeout(pressTimer);
}

function addStat(index,stat){
    players[index].stats[stat]++;
    renderPlayers();
}

function subtractStat(index,stat){
    if(players[index].stats[stat]>0){
        players[index].stats[stat]--;
        renderPlayers();
    }
}

function formatDate(){
    const now=new Date();
    return now.toLocaleDateString('en-US',{
        year:'numeric',
        month:'long',
        day:'numeric'
    });
}

function formatTime(){
    const now=new Date();
    return now.toLocaleTimeString();
}

function exportFinalScore(){
    const exportDiv=document.createElement("div");
    exportDiv.className="exportArea";

    exportDiv.innerHTML=`
        <img src="logo.PNG" class="logoSmall"><br>
        <div class="headerLine">
            ${category.value} • Jornada ${jornada.value}
        </div>
        <div>${formatDate()} | ${formatTime()}</div>
        <div class="divider"></div>
        <h2>${homeScore.value} - ${awayScore.value}</h2>
    `;

    document.body.appendChild(exportDiv);

    html2canvas(exportDiv).then(canvas=>{
        downloadCanvas(canvas,"final_score.png");
        document.body.removeChild(exportDiv);
    });
}

function exportPlayerStats(){

    const activePlayers = players.filter(p =>
        Object.values(p.stats).some(v=>v>0)
    );

    if(activePlayers.length===0){
        alert("No stats recorded.");
        return;
    }

    const usedStats = Object.keys(activePlayers[0].stats).filter(stat =>
        activePlayers.some(p=>p.stats[stat]>0)
    );

    const exportDiv=document.createElement("div");
    exportDiv.className="exportArea";

    let tableHTML="<table><tr><th>Player</th>";

    usedStats.forEach(stat=>{
        tableHTML+=`<th>${stat}</th>`;
    });

    tableHTML+="</tr>";

    activePlayers.forEach((p,i)=>{
        tableHTML+=`<tr class="${i%2===0?'alt':''}">
        <td>${p.name}</td>`;

        usedStats.forEach(stat=>{
            tableHTML+=`<td>${p.stats[stat]===0?'-':p.stats[stat]}</td>`;
        });

        tableHTML+="</tr>";
    });

    tableHTML+="</table>";

    exportDiv.innerHTML=`
        <img src="logo.PNG" class="logoSmall"><br>
        <div class="headerLine">
            ${category.value} • Jornada ${jornada.value}
        </div>
        <div>${formatDate()} | ${formatTime()}</div>
        <div class="divider"></div>
        ${tableHTML}
    `;

    document.body.appendChild(exportDiv);

    html2canvas(exportDiv).then(canvas=>{
        downloadCanvas(canvas,"player_stats.png");
        document.body.removeChild(exportDiv);
    });
}

function downloadCanvas(canvas,name){
    const link=document.createElement("a");
    link.download=name;
    link.href=canvas.toDataURL();
    link.click();
}
</script>

</body>
</html>
