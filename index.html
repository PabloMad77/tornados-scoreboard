<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tornados Scoreboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  margin:0;
  padding:20px;
}

h1{margin-bottom:10px;}

input{
  padding:8px;
  font-size:16px;
  border-radius:8px;
  border:none;
  text-align:center;
  margin:5px;
}

button{
  background:#16a34a;
  color:white;
  padding:10px 15px;
  font-size:18px;
  margin:5px;
  border-radius:10px;
  border:none;
  cursor:pointer;
}

button:hover{opacity:0.85;}

.add1{background:#16a34a;}
.add6{background:#b91c1c;}
.sub{background:#dc2626;}
.export-btn{background:#facc15;color:black;margin-top:20px;}
.reset-btn{background:#333;color:white;margin-top:10px;}

.score-container{
  display:flex;
  justify-content:space-around;
  margin:30px 0;
  flex-wrap:wrap;
}

.team{
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  width:300px;
  margin:10px;
}

.score{
  font-size:70px;
  margin:20px 0;
}

.stats-box{
  margin-top:40px;
  padding:20px;
  border:1px solid #444;
  border-radius:12px;
}

/* MODAL */
#playerModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.modal-content{
  background:#111;
  padding:25px;
  border-radius:15px;
  max-height:80vh;
  overflow-y:auto;
  width:320px;
}

.player-btn{
  width:100%;
  margin:6px 0;
  background:#16a34a;
  color:white;
  font-size:18px;
}

.small-note{
  font-size:12px;
  color:#aaa;
  margin-top:8px;
}
</style>
</head>

<body>

<h1>Tornados Scoreboard</h1>

<input id="categoryInput" placeholder="Category (U14)">
<input id="jornadaInput" placeholder="Jornada (3)">
<br>

<input id="playerNameInput" placeholder="Add Player Name">
<button onclick="addPlayer()">Add Player</button>

<div class="score-container">

  <div class="team">
    <h2>Tornados</h2>
    <div class="score" id="tornadosScore">0</div>
    <button class="add1" onclick="updateScore('tornados',1)">+1</button>
    <button class="add6" onclick="updateScore('tornados',6)">+6</button>
    <button class="sub" onclick="updateScore('tornados',-1)">-1</button>
  </div>

  <div class="team">
    <input type="text" id="opponentName" placeholder="Opponent Name">
    <div class="score" id="opponentScore">0</div>
    <button class="add1" onclick="updateScore('opponent',1)">+1</button>
    <button class="add6" onclick="updateScore('opponent',6)">+6</button>
    <button class="sub" onclick="updateScore('opponent',-1)">-1</button>
  </div>

</div>

<div class="stats-box">
  <h2>Player Stats</h2>

  <div style="margin-top:20px;">
    <button onclick="openPlayerModal('TD')">+TD</button>
    <button onclick="openPlayerModal('INT')">+INT</button>
    <button onclick="openPlayerModal('SACK')">+SACK</button>
    <button onclick="openPlayerModal('XP')">+XP</button>
    <button onclick="openPlayerModal('FLAG')">+FLAG</button>
    <button onclick="openPlayerModal('CATCH')">+CATCH</button>
    <button onclick="openPlayerModal('SAF')">+SAF</button>
  </div>
</div>

<button class="export-btn" onclick="exportStatsImage()">Export Game Stats</button>
<button class="reset-btn" onclick="resetGame()">Reset Game</button>

<img id="teamLogo" src="logo.PNG" style="display:none;">

<!-- PLAYER MODAL -->
<div id="playerModal">
  <div class="modal-content">
    <h3>Select Player</h3>
    <div id="playerList"></div>
    <div class="small-note">Tap = Add | Long Press = Subtract</div>
    <button onclick="closeModal()" style="background:#333;width:100%;margin-top:10px;">Cancel</button>
  </div>
</div>

<script>

let tornadosScore=0;
let opponentScore=0;
let stats={};
let selectedStatType=null;

/* SCORE */
function updateScore(team,value){
  if(team==="tornados"){
    tornadosScore=Math.max(0,tornadosScore+value);
    document.getElementById("tornadosScore").innerText=tornadosScore;
  }else{
    opponentScore=Math.max(0,opponentScore+value);
    document.getElementById("opponentScore").innerText=opponentScore;
  }
}

/* RESET */
function resetGame(){
  if(confirm("Reset the game?")){
    tornadosScore=0;
    opponentScore=0;
    stats={};
    document.getElementById("tornadosScore").innerText=0;
    document.getElementById("opponentScore").innerText=0;
  }
}

/* PLAYER */
function addPlayer(){
  const name=document.getElementById("playerNameInput").value.trim();
  if(!name||stats[name]) return;
  stats[name]={TD:0,INT:0,SACK:0,XP:0,FLAG:0,CATCH:0,SAF:0};
  document.getElementById("playerNameInput").value="";
}

/* MODAL */
function openPlayerModal(statType){
  selectedStatType=statType;
  const modal=document.getElementById("playerModal");
  const list=document.getElementById("playerList");
  list.innerHTML="";
  const players=Object.keys(stats);

  if(players.length===0){
    list.innerHTML="<p>No players added</p>";
  }else{
    players.forEach(player=>{
      const btn=document.createElement("button");
      btn.innerText=player;
      btn.className="player-btn";

      let pressTimer;

      btn.onclick=()=>{
        stats[player][selectedStatType]++;
        closeModal();
      };

      btn.onmousedown=()=>{
        pressTimer=setTimeout(()=>{
          stats[player][selectedStatType]=Math.max(0,stats[player][selectedStatType]-1);
          closeModal();
        },600);
      };

      btn.onmouseup=()=>clearTimeout(pressTimer);
      btn.onmouseleave=()=>clearTimeout(pressTimer);
      btn.ontouchstart=btn.onmousedown;
      btn.ontouchend=()=>clearTimeout(pressTimer);

      list.appendChild(btn);
    });
  }

  modal.style.display="flex";
}

function closeModal(){
  document.getElementById("playerModal").style.display="none";
}

/* EXPORT (UPDATED LOGIC ONLY) */
function exportStatsImage(){

  const activePlayers = Object.keys(stats).filter(player =>
    Object.values(stats[player]).some(val=>val>0)
  );

  if(activePlayers.length===0){
    alert("No player stats to export.");
    return;
  }

  const allStats = Object.keys(stats[activePlayers[0]]);
  const usedStats = allStats.filter(stat =>
    activePlayers.some(player=>stats[player][stat]>0)
  );

  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");

  const rowHeight=55;
  const headerHeight=300;
  canvas.width=1080;
  canvas.height=headerHeight + (activePlayers.length*rowHeight) + 100;

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const logo=new Image();
  logo.src="logo.PNG";

  logo.onload=function(){

    ctx.drawImage(logo,490,40,100,100);

    ctx.fillStyle="white";
    ctx.font="bold 55px Arial";
    ctx.textAlign="center";
    ctx.fillText("TORNADOS GAME STATS",540,180);

    ctx.strokeStyle="rgba(255,255,255,0.3)";
    ctx.beginPath();
    ctx.moveTo(150,220);
    ctx.lineTo(930,220);
    ctx.stroke();

    ctx.textAlign="left";
    ctx.font="28px Arial";
    ctx.fillStyle="white";

    let startY=260;
    ctx.fillText("Player",170,startY);

    usedStats.forEach((stat,i)=>{
      ctx.fillText(stat,450+(i*90),startY);
    });

    startY+=40;

    activePlayers.forEach((player,index)=>{

      if(index%2===0){
        ctx.fillStyle="#111";
        ctx.fillRect(150,startY-30,780,rowHeight);
      }

      ctx.fillStyle="white";
      ctx.fillText(player,170,startY);

      usedStats.forEach((stat,i)=>{
        const val=stats[player][stat]===0?"-":stats[player][stat];
        ctx.fillText(val,450+(i*90),startY);
      });

      startY+=rowHeight;
    });

    const link=document.createElement("a");
    link.download="tornados_game_stats.png";
    link.href=canvas.toDataURL("image/png");
    link.click();
  };
}

</script>
</body>
</html>
