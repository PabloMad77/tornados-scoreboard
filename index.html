<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tornados Stats</title>

<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

input,button{
  padding:6px;
  margin:4px;
  border-radius:6px;
  border:none;
}

button{
  background:#0a84ff;
  color:white;
  cursor:pointer;
}

table{
  margin:auto;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  border:1px solid #444;
  padding:6px 10px;
}

tr:nth-child(even){
  background:#1c1c1c;
}

tr:nth-child(odd){
  background:#2a2a2a;
}
</style>
</head>
<body>

<h2>Tornados Game Stats</h2>

Category:
<input id="category">

Jornada:
<input id="jornada">

<br>

Our Team:
<input id="ourTeam" value="Tornados">

Score:
<input id="ourScore" type="number" value="0">

Opponent:
<input id="oppTeam">

Score:
<input id="oppScore" type="number" value="0">

<br><br>

Player Name:
<input id="playerName">
<button onclick="addPlayer()">Add Player</button>

<table id="statsTable">
<thead>
<tr>
<th>Name</th>
<th>TD</th>
<th>FLAG</th>
<th>CATCH</th>
</tr>
</thead>
<tbody></tbody>
</table>

<br>

<button onclick="exportFinalScore()">Export Final Score</button>
<button onclick="exportStats()">Export Game Stats</button>

<script>

let players=[];

function addPlayer(){
  const name=document.getElementById("playerName").value.trim();
  if(!name) return;

  players.push({
    name:name,
    td:0,
    flag:0,
    catch:0
  });

  document.getElementById("playerName").value="";
  renderTable();
}

function changeStat(index,stat,amount){
  players[index][stat]+=amount;
  if(players[index][stat]<0) players[index][stat]=0;
  renderTable();
}

function renderTable(){
  const tbody=document.querySelector("#statsTable tbody");
  tbody.innerHTML="";

  players.forEach((p,i)=>{
    const row=document.createElement("tr");

    row.innerHTML=`
      <td>${p.name}</td>
      <td>
        ${p.td}
        <button onclick="changeStat(${i},'td',1)">+TD</button>
        <button oncontextmenu="changeStat(${i},'td',-1);return false;">-</button>
      </td>
      <td>
        ${p.flag}
        <button onclick="changeStat(${i},'flag',1)">+FLAG</button>
        <button oncontextmenu="changeStat(${i},'flag',-1);return false;">-</button>
      </td>
      <td>
        ${p.catch}
        <button onclick="changeStat(${i},'catch',1)">+CATCH</button>
        <button oncontextmenu="changeStat(${i},'catch',-1);return false;">-</button>
      </td>
    `;
    tbody.appendChild(row);
  });
}

function getDateTime(){
  const now=new Date();
  return now.toLocaleDateString()+" "+now.toLocaleTimeString();
}

async function shareCanvas(canvas,fileName){
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
  const file=new File([blob],fileName,{type:"image/png"});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:fileName});
    }catch{}
  }else{
    const link=document.createElement("a");
    link.download=fileName;
    link.href=URL.createObjectURL(blob);
    link.click();
  }
}

function exportFinalScore(){

  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");

  canvas.width=800;
  canvas.height=600;

  ctx.fillStyle="#111";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const logo=new Image();
  logo.src="logo.PNG";

  logo.onload=function(){

    ctx.drawImage(logo,20,20,80,80);

    ctx.fillStyle="white";
    ctx.font="28px Arial";
    ctx.fillText(document.getElementById("category").value,120,50);
    ctx.fillText(document.getElementById("jornada").value,120,90);

    ctx.font="36px Arial";
    ctx.fillText(
      document.getElementById("ourTeam").value,
      100,250
    );

    ctx.fillText(
      document.getElementById("oppTeam").value,
      450,250
    );

    ctx.font="60px Arial";
    ctx.fillText(
      document.getElementById("ourScore").value,
      200,350
    );

    ctx.fillText(
      document.getElementById("oppScore").value,
      550,350
    );

    ctx.font="20px Arial";
    ctx.fillText(getDateTime(),20,580);

    shareCanvas(canvas,"final_score.png");
  };
}

function exportStats(){

  const usedPlayers=players.filter(p=>
    p.td>0 || p.flag>0 || p.catch>0
  );

  if(usedPlayers.length===0){
    alert("No stats to export");
    return;
  }

  const showTD=usedPlayers.some(p=>p.td>0);
  const showFLAG=usedPlayers.some(p=>p.flag>0);
  const showCATCH=usedPlayers.some(p=>p.catch>0);

  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");

  canvas.width=1000;
  canvas.height=200+usedPlayers.length*40;

  ctx.fillStyle="#111";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const logo=new Image();
  logo.src="logo.PNG";

  logo.onload=function(){

    ctx.drawImage(logo,20,20,60,60);

    ctx.fillStyle="white";
    ctx.font="22px Arial";

    ctx.fillText(document.getElementById("category").value,100,40);
    ctx.fillText(document.getElementById("jornada").value,100,70);
    ctx.fillText(getDateTime(),100,100);

    let y=150;

    usedPlayers.forEach((p,i)=>{

      ctx.fillStyle=i%2===0?"#222":"#333";
      ctx.fillRect(0,y-25,canvas.width,35);

      ctx.fillStyle="white";
      ctx.font="20px Arial";

      let x=50;
      ctx.fillText(p.name,x,y);

      x+=250;

      if(showTD){
        ctx.fillText(p.td>0?p.td:"-",x,y);
        x+=100;
      }

      if(showFLAG){
        ctx.fillText(p.flag>0?p.flag:"-",x,y);
        x+=100;
      }

      if(showCATCH){
        ctx.fillText(p.catch>0?p.catch:"-",x,y);
      }

      y+=40;
    });

    shareCanvas(canvas,"game_stats.png");
  };
}

</script>

</body>
</html>
