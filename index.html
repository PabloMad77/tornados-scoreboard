<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tornados Scoreboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #000000;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 { margin-bottom: 10px; }

input, select {
  padding: 8px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  text-align: center;
  margin: 5px;
}

.score-container {
  display: flex;
  justify-content: space-around;
  margin: 30px 0;
  flex-wrap: wrap;
}

.team {
  background: white;
  color: black;
  padding: 20px;
  border-radius: 15px;
  width: 300px;
  margin: 10px;
}

.score {
  font-size: 70px;
  margin: 20px 0;
}

button {
  padding: 10px 15px;
  font-size: 16px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

.add1 { background: #16a34a; color: white; }
.add6 { background: #b91c1c; color: white; }
.sub { background: #dc2626; color: white; }
.export-btn { background: #facc15; color: black; margin-top: 20px; }
.stats-btn { background: #2563eb; color: white; margin-top: 10px; }
.reset-btn { background: #333; color: white; margin-top: 10px; }

.stats-panel {
  margin-top: 40px;
  padding: 20px;
  border-top: 2px solid #444;
}
/* Button press animation */
button {
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

button:active {
  transform: scale(0.92);
}

/* Flash effect */
.flash {
  animation: flashEffect 0.25s ease;
}

@keyframes flashEffect {
  0% { box-shadow: 0 0 0px rgba(255,255,255,0); }
  50% { box-shadow: 0 0 20px rgba(255,255,255,0.6); }
  100% { box-shadow: 0 0 0px rgba(255,255,255,0); }
}
  
</style>
</head>

<body>

<h1>Tornados Scoreboard</h1>

<input type="text" id="categoryName" placeholder="Category (Ex: U10)" oninput="saveState()">
<input type="text" id="jornadaName" placeholder="Jornada (Ex: Jornada 1)" oninput="saveState()">

<div class="score-container">

  <div class="team">
    <h2>Tornados</h2>
    <div class="score" id="tornadosScore">0</div>
    <button class="add1" onclick="updateScore('tornados',1)">+1</button>
    <button class="add6" onclick="updateScore('tornados',6)">+6</button>
    <button class="sub" onclick="updateScore('tornados',-1)">-1</button>
  </div>

  <div class="team">
    <input type="text" id="opponentName" placeholder="Opponent Name" oninput="saveState()">
    <div class="score" id="opponentScore">0</div>
    <button class="add1" onclick="updateScore('opponent',1)">+1</button>
    <button class="add6" onclick="updateScore('opponent',6)">+6</button>
    <button class="sub" onclick="updateScore('opponent',-1)">-1</button>
  </div>

</div>

<button class="export-btn" onclick="exportScore()">Export Final Score</button>
<br>
<button class="stats-btn" onclick="exportStats()">Export Game Stats</button>
<br>
<button class="reset-btn" onclick="resetGame()">Reset Game</button>

<div class="stats-panel">
  <h2>Game Stats - Tornados Players</h2>

  <input type="text" id="newPlayerName" placeholder="Add Player Name">
  <button onclick="addPlayer()">Add Player</button>

  <br><br>

  <select id="playerSelect"></select>

  <br><br>

  <button onclick="addStat('TD', this)">+TD</button>
<button onclick="addStat('INT', this)">+INT</button>
<button onclick="addStat('SACK', this)">+SACK</button>
<button onclick="addStat('XP', this)">+XP</button>
<button onclick="addStat('TKL', this)">+TKL</button>
<button onclick="addStat('SAF', this)">+SAFETY</button>

</div>

<script>

let tornadosScore = 0;
let opponentScore = 0;
let stats = {};

window.onload = function() {
  const saved = JSON.parse(localStorage.getItem("tornadosGame"));
  const savedStats = JSON.parse(localStorage.getItem("tornadosStats"));

  if (saved) {
    tornadosScore = saved.tornados;
    opponentScore = saved.opponent;
    document.getElementById("tornadosScore").innerText = tornadosScore;
    document.getElementById("opponentScore").innerText = opponentScore;
    document.getElementById("opponentName").value = saved.opponentName;
    document.getElementById("categoryName").value = saved.category;
    document.getElementById("jornadaName").value = saved.jornada;
  }

  if (savedStats) {
    stats = savedStats;
    updatePlayerDropdown();
  }
};

function saveState() {
  const data = {
    tornados: tornadosScore,
    opponent: opponentScore,
    opponentName: document.getElementById("opponentName").value,
    category: document.getElementById("categoryName").value,
    jornada: document.getElementById("jornadaName").value
  };
  localStorage.setItem("tornadosGame", JSON.stringify(data));
  localStorage.setItem("tornadosStats", JSON.stringify(stats));
}

function updateScore(team, value) {
  if (team === "tornados") {
    tornadosScore = Math.max(0, tornadosScore + value);
    document.getElementById("tornadosScore").innerText = tornadosScore;
  } else {
    opponentScore = Math.max(0, opponentScore + value);
    document.getElementById("opponentScore").innerText = opponentScore;
  }
  saveState();
}

function addPlayer() {
  const name = document.getElementById("newPlayerName").value.trim();
  if (!name || stats[name]) return;

  stats[name] = { TD:0, INT:0, SACK:0, XP:0, TKL:0, SAF:0 };
  document.getElementById("newPlayerName").value = "";
  updatePlayerDropdown();
  saveState();
}

function updatePlayerDropdown() {
  const select = document.getElementById("playerSelect");
  select.innerHTML = "";
  for (let player in stats) {
    const option = document.createElement("option");
    option.value = player;
    option.textContent = player;
    select.appendChild(option);
  }
}

function addStat(type, buttonElement) {

  const player = document.getElementById("playerSelect").value;
  if (!player) return;

  stats[player][type]++;
  saveState();

  // Visual feedback
  buttonElement.classList.add("flash");
  setTimeout(() => buttonElement.classList.remove("flash"), 250);

  // Mobile vibration (if supported)
  if (navigator.vibrate) {
    navigator.vibrate(40);
  }
}

/* =======================
   STATS EXPORT (UPGRADED)
======================= */

function exportStats() {

  const canvas = document.createElement("canvas");
  canvas.width = 1080;
  canvas.height = 1080;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, 1080, 1080);

  const logo = new Image();
  logo.src = "./logo.PNG";

  logo.onload = function() {

    ctx.drawImage(logo, 440, 40, 200, 200);

    ctx.fillStyle = "white";
    ctx.textAlign = "center";

    // Main Title
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 70px Arial";
    ctx.fillText("TORNADOS GAME STATS", 540, 120);

    // VS Opponent Line
    const opponentName = document.getElementById("opponentName").value || "OPPONENT";
    ctx.font = "bold 50px Arial";
    ctx.fillText("vs " + opponentName.toUpperCase(), 540, 180);

    ctx.font = "40px Arial";
    ctx.fillText(document.getElementById("categoryName").value || "", 540, 340);
    ctx.fillText(document.getElementById("jornadaName").value || "", 540, 390);

    const startY = 450;
    const rowHeight = 65;

    const colPlayer = 150;
    const colTD = 520;
    const colINT = 610;
    const colSACK = 700;
    const colXP = 790;
    const colTKL = 880;
    const colSAF = 960;

    ctx.font = "bold 32px Arial";
    ctx.textAlign = "left";
    ctx.fillText("PLAYER", colPlayer, startY);

    ctx.textAlign = "center";
    ctx.fillText("TD", colTD, startY);
    ctx.fillText("INT", colINT, startY);
    ctx.fillText("SACK", colSACK, startY);
    ctx.fillText("XP", colXP, startY);
    ctx.fillText("TKL", colTKL, startY);
    ctx.fillText("SAF", colSAF, startY);

    ctx.beginPath();
    ctx.moveTo(120, startY + 20);
    ctx.lineTo(1000, startY + 20);
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.stroke();

    let y = startY + rowHeight;
    let rowIndex = 0;

    function drawStat(value, x, y) {
      if (value === 0) {
        ctx.fillStyle = "#777777";
        ctx.fillText("–", x, y);
      } else {
        ctx.fillStyle = "white";
        ctx.fillText(value, x, y);
      }
    }

    ctx.font = "30px Arial";

    for (let player in stats) {

      const s = stats[player];

      if (rowIndex % 2 === 0) {
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(100, y - 40, 900, rowHeight);
      }

      ctx.fillStyle = "white";
      ctx.textAlign = "left";
      ctx.fillText(player, colPlayer, y);

      ctx.textAlign = "center";
      drawStat(s.TD, colTD, y);
      drawStat(s.INT, colINT, y);
      drawStat(s.SACK, colSACK, y);
      drawStat(s.XP, colXP, y);
      drawStat(s.TKL, colTKL, y);
      drawStat(s.SAF, colSAF, y);

      y += rowHeight;
      rowIndex++;
    }

    const now = new Date();
    const safeDate = now.toISOString().replace(/[:.]/g, "-");
    const link = document.createElement("a");
    link.download = "tornados-game-stats-" + safeDate + ".PNG";
    link.href = canvas.toDataURL("image/PNG");
    link.click();
  };
}

function resetGame() {
  if (confirm("Reset the game?")) {
    tornadosScore = 0;
    opponentScore = 0;
    stats = {};
    localStorage.clear();
    location.reload();
  }
}

</script>

</body>
</html>
