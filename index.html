<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tornados Scoreboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,sans-serif;
  text-align:center;
  background:#000;
  color:white;
  margin:0;
  padding:20px;
}

h1{margin-bottom:10px;}

input{
  padding:8px;
  font-size:18px;
  border-radius:8px;
  border:none;
  text-align:center;
  margin:5px;
}

.score-container{
  display:flex;
  justify-content:space-around;
  margin:30px 0;
  flex-wrap:wrap;
}

.team{
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  width:300px;
  margin:10px;
}

.score{
  font-size:70px;
  margin:20px 0;
}

button{
  padding:10px 15px;
  font-size:18px;
  margin:5px;
  border-radius:10px;
  border:none;
  cursor:pointer;
}

.add1{background:#16a34a;color:white;}
.add6{background:#b91c1c;color:white;}
.sub{background:#dc2626;color:white;}
.export-btn{background:#facc15;color:black;margin-top:20px;}
.reset-btn{background:#333;color:white;margin-top:10px;}

.stats-box{
  margin-top:40px;
  padding:20px;
  border:1px solid #444;
  border-radius:12px;
}

/* MODAL */
#playerModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.modal-content{
  background:#111;
  padding:25px;
  border-radius:15px;
  max-height:80vh;
  overflow-y:auto;
  width:320px;
}

.player-btn{
  width:100%;
  margin:6px 0;
  background:#16a34a;
  color:white;
  font-size:18px;
}

.small-note{
  font-size:12px;
  color:#aaa;
  margin-top:8px;
}
</style>
</head>

<body>

<h1>Tornados Scoreboard</h1>

<input type="text" id="categoryInput" placeholder="Category (U10, U14...)">
<input type="text" id="jornadaInput" placeholder="Jornada / Game Week">

<div class="score-container">

  <div class="team">
    <h2>Tornados</h2>
    <div class="score" id="tornadosScore">0</div>
    <button class="add1" onclick="updateScore('tornados',1)">+1</button>
    <button class="add6" onclick="updateScore('tornados',6)">+6</button>
    <button class="sub" onclick="updateScore('tornados',-1)">-1</button>
  </div>

  <div class="team">
    <input type="text" id="opponentName" placeholder="Opponent Name">
    <div class="score" id="opponentScore">0</div>
    <button class="add1" onclick="updateScore('opponent',1)">+1</button>
    <button class="add6" onclick="updateScore('opponent',6)">+6</button>
    <button class="sub" onclick="updateScore('opponent',-1)">-1</button>
  </div>

</div>

<button class="export-btn" onclick="exportScore()">Export Final Score</button>
<button class="reset-btn" onclick="resetGame()">Reset Game</button>

<div class="stats-box">
  <h2>Player Stats</h2>

  <input type="text" id="playerName" placeholder="Player Name">
  <button onclick="addPlayer()">Add Player</button>

  <div style="margin-top:20px;">
    <button onclick="openPlayerModal('TD')">+TD</button>
    <button onclick="openPlayerModal('INT')">+INT</button>
    <button onclick="openPlayerModal('SACK')">+SACK</button>
    <button onclick="openPlayerModal('XP')">+XP</button>
    <button onclick="openPlayerModal('TKL')">+TKL</button>
    <button onclick="openPlayerModal('SAF')">+SAFETY</button>
  </div>
</div>

<!-- PLAYER MODAL -->
<div id="playerModal">
  <div class="modal-content">
    <h3>Select Player</h3>
    <div id="playerList"></div>
    <div class="small-note">Tap = Add | Long Press = Subtract</div>
    <button onclick="closeModal()" style="background:#333;width:100%;margin-top:10px;">Cancel</button>
  </div>
</div>

<script>

let tornadosScore=0;
let opponentScore=0;
let stats={};
let selectedStatType=null;

/* SCORE */
function updateScore(team,value){
  if(team==="tornados"){
    tornadosScore=Math.max(0,tornadosScore+value);
    document.getElementById("tornadosScore").innerText=tornadosScore;
  }else{
    opponentScore=Math.max(0,opponentScore+value);
    document.getElementById("opponentScore").innerText=opponentScore;
  }
}

/* RESET */
function resetGame(){
  if(confirm("Reset the game?")){
    tornadosScore=0;
    opponentScore=0;
    stats={};
    document.getElementById("tornadosScore").innerText=0;
    document.getElementById("opponentScore").innerText=0;
  }
}

/* ADD PLAYER */
function addPlayer(){
  const name=document.getElementById("playerName").value.trim();
  if(!name||stats[name]) return;

  stats[name]={TD:0,INT:0,SACK:0,XP:0,TKL:0,SAF:0};
  document.getElementById("playerName").value="";
}

/* OPEN MODAL */
function openPlayerModal(statType){
  selectedStatType=statType;

  const modal=document.getElementById("playerModal");
  const list=document.getElementById("playerList");
  list.innerHTML="";

  const players=Object.keys(stats);

  if(players.length===0){
    list.innerHTML="<p>No players added</p>";
  }else{
    players.forEach(player=>{
      const btn=document.createElement("button");
      btn.innerText=player;
      btn.className="player-btn";

      let pressTimer;

      // TAP = ADD
      btn.onclick=()=>{
        stats[player][selectedStatType]++;
        closeModal();
        if(navigator.vibrate) navigator.vibrate(40);
      };

      // LONG PRESS = SUBTRACT
      btn.onmousedown=()=>{
        pressTimer=setTimeout(()=>{
          stats[player][selectedStatType]=Math.max(0,stats[player][selectedStatType]-1);
          closeModal();
          if(navigator.vibrate) navigator.vibrate([40,40,40]);
        },600);
      };

      btn.onmouseup=()=>clearTimeout(pressTimer);
      btn.onmouseleave=()=>clearTimeout(pressTimer);

      // MOBILE SUPPORT
      btn.ontouchstart=()=>{
        pressTimer=setTimeout(()=>{
          stats[player][selectedStatType]=Math.max(0,stats[player][selectedStatType]-1);
          closeModal();
          if(navigator.vibrate) navigator.vibrate([40,40,40]);
        },600);
      };

      btn.ontouchend=()=>clearTimeout(pressTimer);

      list.appendChild(btn);
    });
  }

  modal.style.display="flex";
}

function closeModal(){
  document.getElementById("playerModal").style.display="none";
}

/* EXPORT (simple version kept) */
function exportScore(){
  alert("Export function remains as your upgraded version.");
}

</script>
</body>
</html>
