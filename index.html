<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tornados Scoreboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #c2410c; /* Dark Orange */
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  margin-bottom: 10px;
}

input {
  padding: 8px;
  font-size: 18px;
  border-radius: 8px;
  border: none;
  text-align: center;
}

.score-container {
  display: flex;
  justify-content: space-around;
  margin: 30px 0;
  flex-wrap: wrap;
}

.team {
  background: white;
  color: #c2410c;
  padding: 20px;
  border-radius: 15px;
  width: 300px;
  margin: 10px;
}

.score {
  font-size: 70px;
  margin: 20px 0;
}

button {
  padding: 10px 15px;
  font-size: 18px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

.add1 { background: #16a34a; color: white; }
.add6 { background: #7c2d12; color: white; }
.sub { background: #dc2626; color: white; }
.export-btn { background: #facc15; color: black; margin-top: 20px; }
.reset-btn { background: black; color: white; margin-top: 10px; }

</style>
</head>

<body>

<h1>🌪 Tornados Scoreboard</h1>

<div class="score-container">

  <div class="team">
    <h2>Tornados</h2>
    <div class="score" id="tornadosScore">0</div>
    <button class="add1" onclick="updateScore('tornados',1)">+1</button>
    <button class="add6" onclick="updateScore('tornados',6)">+6</button>
    <button class="sub" onclick="updateScore('tornados',-1)">-1</button>
  </div>

  <div class="team">
    <input type="text" id="opponentName" placeholder="Opponent Name" oninput="saveState()">
    <div class="score" id="opponentScore">0</div>
    <button class="add1" onclick="updateScore('opponent',1)">+1</button>
    <button class="add6" onclick="updateScore('opponent',6)">+6</button>
    <button class="sub" onclick="updateScore('opponent',-1)">-1</button>
  </div>

</div>

<button class="export-btn" onclick="exportScore()">Export Score Image</button>
<br>
<button class="reset-btn" onclick="resetGame()">Reset Game</button>

<script>

// ---------------- STATE ----------------

let tornadosScore = 0;
let opponentScore = 0;

// ---------------- LOAD SAVED ----------------

window.onload = function() {
  const saved = JSON.parse(localStorage.getItem("tornadosGame"));

  if (saved) {
    tornadosScore = saved.tornados;
    opponentScore = saved.opponent;
    document.getElementById("tornadosScore").innerText = tornadosScore;
    document.getElementById("opponentScore").innerText = opponentScore;
    document.getElementById("opponentName").value = saved.opponentName;
  }
};

// ---------------- SAVE ----------------

function saveState() {
  const data = {
    tornados: tornadosScore,
    opponent: opponentScore,
    opponentName: document.getElementById("opponentName").value
  };

  localStorage.setItem("tornadosGame", JSON.stringify(data));
}

// ---------------- UPDATE SCORE ----------------

function updateScore(team, value) {

  if (team === "tornados") {
    tornadosScore = Math.max(0, tornadosScore + value);
    document.getElementById("tornadosScore").innerText = tornadosScore;
  } else {
    opponentScore = Math.max(0, opponentScore + value);
    document.getElementById("opponentScore").innerText = opponentScore;
  }

  saveState();
}

// ---------------- RESET ----------------

function resetGame() {
  if (confirm("Reset the game?")) {
    tornadosScore = 0;
    opponentScore = 0;
    document.getElementById("tornadosScore").innerText = 0;
    document.getElementById("opponentScore").innerText = 0;
    document.getElementById("opponentName").value = "";
    localStorage.removeItem("tornadosGame");
  }
}

// ---------------- EXPORT ----------------

function exportScore() {

  const canvas = document.createElement("canvas");
  canvas.width = 1080;
  canvas.height = 1080;
  const ctx = canvas.getContext("2d");

  // Dark Orange Background
  ctx.fillStyle = "#c2410c";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const logo = new Image();
  logo.src = "./logo.PNG";

  logo.onload = function() {

    // Proportional Logo
    const desiredWidth = 450;
    const scale = desiredWidth / logo.width;
    const newHeight = logo.height * scale;

    const xPosition = (canvas.width - desiredWidth) / 2;
    const yPosition = 120;

    ctx.drawImage(logo, xPosition, yPosition, desiredWidth, newHeight);

    // Title
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 70px Arial";
    ctx.fillText("FINAL SCORE", 540, 650);

    // Scores
    ctx.font = "bold 90px Arial";
    ctx.fillText("TORNADOS " + tornadosScore, 540, 820);

    const opponentName = document.getElementById("opponentName").value || "OPPONENT";
    ctx.fillText(opponentName.toUpperCase() + " " + opponentScore, 540, 950);

    // Date + Time
    const now = new Date();
    const formattedDate = now.toLocaleDateString();
    const formattedTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    ctx.font = "40px Arial";
    ctx.fillText(formattedDate + " • " + formattedTime, 540, 1030);

    // Filename
    const safeDate = now.toISOString().replace(/[:.]/g, "-");
    const link = document.createElement("a");
    link.download = "tornados-final-score-" + safeDate + ".PNG";
    link.href = canvas.toDataURL("image/PNG");
    link.click();
  };

  logo.onerror = function() {
    alert("Logo not found. Make sure logo.png is in the same folder.");
  };
}

</script>

</body>
</html>
