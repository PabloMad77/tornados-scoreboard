<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tornados Scoreboard</title>

<style>
body{
  background:#0a0a0a;
  color:white;
  font-family:Arial;
  text-align:center;
}

input, button{
  padding:10px;
  margin:5px;
  font-size:16px;
}

button{
  background:#16a34a;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  opacity:0.85;
}

.stat-buttons button{
  width:80px;
  margin:8px;
  font-weight:bold;
}

#playerModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

#modalContent{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  max-height:80vh;
  overflow-y:auto;
}

#modalContent button{
  width:100%;
  margin:6px 0;
}
</style>
</head>

<body>

<h1>TORNADOS SCOREBOARD</h1>

<input id="categoryInput" placeholder="Category (U14)">
<input id="jornadaInput" placeholder="Jornada (3)">
<br>

<input id="playerNameInput" placeholder="Add Player Name">
<button onclick="addPlayer()">Add Player</button>

<div class="stat-buttons">
  <button onclick="openPlayerModal('TD')">+TD</button>
  <button onclick="openPlayerModal('INT')">+INT</button>
  <button onclick="openPlayerModal('SACK')">+SACK</button>
  <button onclick="openPlayerModal('XP')">+XP</button>
  <button onclick="openPlayerModal('TKL')">+TKL</button>
  <button onclick="openPlayerModal('SAF')">+SAF</button>
</div>

<br>
<button onclick="exportGameStatsImage()">Export Game Stats</button>

<img id="teamLogo" src="logo.PNG" style="display:none;">

<!-- PLAYER MODAL -->
<div id="playerModal">
  <div id="modalContent">
    <h3>Select Player</h3>
    <div id="playerList"></div>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>

let stats = {};
let selectedStatType = null;

// Add Player
function addPlayer(){
  const nameInput = document.getElementById("playerNameInput");
  const name = nameInput.value.trim();
  if(!name) return;

  if(!stats[name]){
    stats[name] = { TD:0, INT:0, SACK:0, XP:0, TKL:0, SAF:0 };
  }

  nameInput.value = "";
}

// Open Modal
function openPlayerModal(statType){
  selectedStatType = statType;

  const list = document.getElementById("playerList");
  list.innerHTML = "";

  const players = Object.keys(stats);

  if(players.length === 0){
    list.innerHTML = "<p>No players added</p>";
  } else {

    players.forEach(player => {

      const btn = document.createElement("button");
      btn.innerText = player;

      let pressTimer;

      // Short click = add stat
      btn.onclick = () => {
        stats[player][selectedStatType]++;
        if(navigator.vibrate) navigator.vibrate(40);
        closeModal();
      };

      // Long press = subtract stat
      btn.onmousedown = () => {
        pressTimer = setTimeout(() => {
          if(stats[player][selectedStatType] > 0){
            stats[player][selectedStatType]--;
          }
          if(navigator.vibrate) navigator.vibrate([50,50,50]);
          closeModal();
        }, 700);
      };

      btn.onmouseup = () => clearTimeout(pressTimer);
      btn.onmouseleave = () => clearTimeout(pressTimer);

      list.appendChild(btn);
    });
  }

  document.getElementById("playerModal").style.display = "flex";
}

// Close Modal
function closeModal(){
  document.getElementById("playerModal").style.display = "none";
}

// EXPORT FUNCTION
function exportGameStatsImage() {

  if(Object.keys(stats).length === 0){
    alert("No player stats to export.");
    return;
  }

  const category = document.getElementById("categoryInput").value || "";
  const jornada = document.getElementById("jornadaInput").value || "";

  const logoImg = new Image();
  logoImg.src = "logo.PNG";

  logoImg.onload = function(){

    const now = new Date();

    const formattedDate = now.toLocaleDateString("en-US", {
      year:"numeric",
      month:"long",
      day:"numeric"
    });

    const formattedTime = now.toLocaleTimeString("en-US", {
      hour:"2-digit",
      minute:"2-digit"
    });

    const players = Object.keys(stats);

    const rowHeight = 45;
    const headerHeight = 260;
    const canvasWidth = 900;
    const canvasHeight = headerHeight + (players.length * rowHeight) + 80;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    // Background
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(0,0,canvasWidth,canvasHeight);

    // Glow
    const glow = ctx.createRadialGradient(
      canvasWidth/2,0,100,
      canvasWidth/2,0,600
    );
    glow.addColorStop(0,"rgba(0,255,255,0.25)");
    glow.addColorStop(1,"transparent");
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,canvasWidth,canvasHeight);

    // Logo
    const logoSize = 80;
    ctx.drawImage(
      logoImg,
      (canvasWidth/2)-(logoSize/2),
      20,
      logoSize,
      logoSize
    );

    // Title
    ctx.fillStyle="#ffffff";
    ctx.font="bold 40px Arial";
    ctx.textAlign="center";
    ctx.fillText("TORNADOS GAME STATS", canvasWidth/2,130);

    // Category + Jornada
    ctx.font="24px Arial";
    ctx.fillStyle="#00ffff";
    ctx.fillText(`${category} • Jornada ${jornada}`, canvasWidth/2,165);

    // Date + Time
    ctx.fillStyle="#cccccc";
    ctx.font="20px Arial";
    ctx.fillText(`${formattedDate} | ${formattedTime}`, canvasWidth/2,195);

    // Divider
    ctx.strokeStyle="#333";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(80,215);
    ctx.lineTo(canvasWidth-80,215);
    ctx.stroke();

    // Headers
    ctx.textAlign="left";
    ctx.font="bold 20px Arial";
    ctx.fillStyle="#ffffff";

    const startY = 250;

    ctx.fillText("Player",100,startY);
    ctx.fillText("TD",420,startY);
    ctx.fillText("INT",480,startY);
    ctx.fillText("SACK",550,startY);
    ctx.fillText("XP",630,startY);
    ctx.fillText("TKL",690,startY);
    ctx.fillText("SAF",760,startY);

    ctx.font="18px Arial";

    players.forEach((player,index)=>{

      const y = startY+30+(index*rowHeight);

      ctx.fillStyle = index%2===0 ? "#111111" : "#1a1a1a";
      ctx.fillRect(80,y-25,canvasWidth-160,rowHeight);

      ctx.fillStyle="#ffffff";

      const p = stats[player];

      ctx.fillText(player,100,y);
      ctx.fillText(p.TD===0?"-":p.TD,420,y);
      ctx.fillText(p.INT===0?"-":p.INT,480,y);
      ctx.fillText(p.SACK===0?"-":p.SACK,550,y);
      ctx.fillText(p.XP===0?"-":p.XP,630,y);
      ctx.fillText(p.TKL===0?"-":p.TKL,690,y);
      ctx.fillText(p.SAF===0?"-":p.SAF,760,y);
    });

    ctx.textAlign="center";
    ctx.fillStyle="#666";
    ctx.font="16px Arial";
    ctx.fillText("Powered by Tornados Scoreboard",canvasWidth/2,canvasHeight-30);

    const link=document.createElement("a");
    link.download="tornados_game_stats.png";
    link.href=canvas.toDataURL("image/png");
    link.click();
  };
}

</script>
</body>
</html>
